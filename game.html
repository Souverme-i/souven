<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>躲避弹幕移动端</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#050508;overflow:hidden;
    font-family:"Courier New",monospace;color:#fff;touch-action:none;user-select:none;}

  #rotate{position:fixed;inset:0;background:#050508;z-index:999;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    font-size:18px;color:#8a8aa0;text-align:center;line-height:2;letter-spacing:1px;}
  #rotate .icon{font-size:52px;margin-bottom:20px;animation:spin 2s ease-in-out infinite;}
  @keyframes spin{0%{transform:rotate(0)}50%{transform:rotate(90deg)}100%{transform:rotate(90deg)}}
  @media (orientation: landscape){ #rotate{display:none;} }

  #game-wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;
    background:radial-gradient(circle at 50% 40%, #0d0d18 0%, #050508 70%);}
  canvas{background:#000;border:2px solid #2a2a3a;border-radius:6px;
    box-shadow:0 0 40px rgba(80,120,255,0.15), 0 0 80px rgba(255,60,90,0.08);
    image-rendering:pixelated;max-width:100vw;max-height:100vh;}

  #controls{position:fixed;inset:0;pointer-events:none;z-index:10;
    display:flex;justify-content:space-between;align-items:flex-end;
    padding:0 28px 28px;}

  #joystick{width:150px;height:150px;border-radius:50%;
    border:2px solid rgba(120,140,255,0.35);
    background:radial-gradient(circle, rgba(80,100,200,0.12) 0%, rgba(20,20,40,0.35) 100%);
    position:relative;pointer-events:auto;touch-action:none;flex-shrink:0;
    box-shadow:inset 0 0 20px rgba(80,120,255,0.12), 0 0 16px rgba(80,120,255,0.08);}
  #stick{width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #9ab0ff, #4a5aa0);
    box-shadow:0 0 16px rgba(120,150,255,0.6), inset 0 -4px 8px rgba(0,0,0,0.4);
    position:absolute;left:43px;top:43px;transition:background 0.1s, box-shadow 0.1s;}
  #joystick.active #stick{background:radial-gradient(circle at 35% 35%, #c0d0ff, #6070c0);
    box-shadow:0 0 24px rgba(150,180,255,0.9), inset 0 -4px 8px rgba(0,0,0,0.4);}

  #buttons{display:flex;flex-direction:column;gap:14px;pointer-events:auto;flex-shrink:0;}
  .btn{width:76px;height:76px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.35);
    background:radial-gradient(circle at 35% 35%, rgba(255,255,255,0.18), rgba(40,40,60,0.6));
    color:#fff;font-size:15px;font-family:"Courier New",monospace;font-weight:bold;
    display:flex;justify-content:center;align-items:center;
    touch-action:none;cursor:pointer;letter-spacing:1px;
    box-shadow:0 0 12px rgba(255,255,255,0.08), inset 0 -3px 6px rgba(0,0,0,0.3);
    transition:transform 0.08s, box-shadow 0.08s, background 0.08s;}
  .btn:active{transform:scale(0.92);
    background:radial-gradient(circle at 35% 35%, rgba(255,255,255,0.4), rgba(80,80,120,0.7));
    box-shadow:0 0 24px rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.3);}
  .btn.small{width:58px;height:58px;font-size:12px;}
  .btn-row{display:flex;gap:14px;justify-content:flex-end;}

  @media (orientation: portrait){
    #controls, #game-wrap{display:none;}
  }
</style>
</head>
<body>

<div id="rotate">
  <div class="icon">📱</div>
  请将手机横屏<br>以获得最佳游戏体验
</div>

<div id="game-wrap">
  <canvas id="game" width="800" height="450"></canvas>
</div>

<div id="controls">
  <div id="joystick"><div id="stick"></div></div>
  <div id="buttons">
    <div class="btn-row">
      <div class="btn small" id="btnC">时停</div>
      <div class="btn small" id="btnR">重开</div>
    </div>
    <div class="btn-row">
      <div class="btn" id="btnAct">行动</div>
      <div class="btn" id="btnMercy">仁慈</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const boxNormal = { x: 250, y: 240, w: 300, h: 150 };
const boxBattle = { x: 250, y: 200, w: 300, h: 180 };
let box = { ...boxNormal };

const player = {
  x: boxBattle.x + boxBattle.w/2, y: boxBattle.y + boxBattle.h/2,
  size: 10, speed: 3.4,
  hp: 20, maxHp: 20,
  focus: 0, maxFocus: 100,
  frozen: 0, hurtFlash: 0, glow: 0
};

let state = 'menu';
let turnCount = 0;
let bullets = [];
let particles = [];
let stars = [];
let spawnTimer = 0;
let patternIndex = 0;
let battleTimer = 0;
const BATTLE_FRAMES = 420;
let message = '按「行动」开始';
let typedMessage = '';
let typingTimer = 0;
let resultText = '';
let shake = 0;
let fade = 1;
let currentMenu = 0;
let enemyShake = 0;
let enemyBreath = 0;
let talkPoints = 0;
const TALK_NEEDED = 3;
let mercyReady = false;
let outcome = '';
let hitStop = 0;

// 音效
let audioCtx = null;
function ensureAudio(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type='square', vol=0.06, slide=0){
  ensureAudio();
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq+slide), audioCtx.currentTime + dur);
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function sfxConfirm(){ beep(660, 0.08, 'square', 0.05); setTimeout(()=>beep(880,0.08,'square',0.05), 60); }
function sfxHit(){ beep(140, 0.18, 'sawtooth', 0.09, -60); }
function sfxTimeStop(){ beep(300, 0.3, 'sine', 0.07, 400); }
function sfxMercy(){ beep(523,0.12,'sine',0.06); setTimeout(()=>beep(659,0.12,'sine',0.06),100); setTimeout(()=>beep(784,0.2,'sine',0.06),200); }
function sfxStart(){ beep(220,0.1,'square',0.05); setTimeout(()=>beep(330,0.1,'square',0.05),80); }

// 星点背景
for (let i=0;i<60;i++){
  stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*1.5+0.5, sp:Math.random()*0.3+0.1});
}

const keys = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (e.key.startsWith('Arrow')) e.preventDefault();
  handleAction(k);
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function handleAction(k){
  ensureAudio();
  if (state === 'menu' && (k === 'z' || k === 'x')) { state = 'choose'; currentMenu = 0; setMessage('选择你的行动。'); box = { ...boxNormal }; fade = 0.6; sfxConfirm(); }
  else if (state === 'choose'){
    if (k === 'arrowleft' || k === 'arrowright' || k === 'a' || k === 'd'){ currentMenu = currentMenu === 0 ? 1 : 0; sfxConfirm(); }
    if (k === 'z') confirmChoose();
  }
  else if (state === 'battle' && k === 'c') tryTimeStop();
  else if (state === 'result' && k === 'r') resetGame();
}

function bindBtn(id, action){
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); ensureAudio(); action(); }, {passive:false});
  el.addEventListener('mousedown', e => { e.preventDefault(); ensureAudio(); action(); });
}
bindBtn('btnAct', () => { if (state === 'menu' || state === 'choose') doAct(); });
bindBtn('btnMercy', () => { if (state === 'menu' || state === 'choose') doMercy(); });
bindBtn('btnC', () => tryTimeStop());
bindBtn('btnR', () => resetGame());

function setMessage(m){
  message = m; typedMessage = ''; typingTimer = 0;
}

function doAct(){
  talkPoints++;
  if (talkPoints >= TALK_NEEDED){
    mercyReady = true;
    setMessage(`你与敌人交谈。（交涉 ${talkPoints}/${TALK_NEEDED}）敌人动摇了，仁慈已可用。`);
  } else {
    setMessage(`你与敌人交谈。（交涉 ${talkPoints}/${TALK_NEEDED}）`);
  }
  startBattle();
}

function doMercy(){
  if (mercyReady || talkPoints >= TALK_NEEDED){
    state = 'result'; outcome = 'mercy';
    resultText = '你宽恕了敌人。战斗和平结束。';
    fade = 1; box = { ...boxNormal }; sfxMercy();
    for (let i=0;i<40;i++) spawnParticle(box.x+box.w/2, box.y+box.h/2, '#7dffa0');
    return;
  }
  setMessage('敌人还不愿意听你的…弹幕来袭！');
  startBattle();
}

function confirmChoose(){
  sfxConfirm();
  if (currentMenu === 0) doAct();
  else doMercy();
}

function tryTimeStop(){
  if (state === 'battle' && player.focus >= player.maxFocus){
    player.frozen = 90; player.focus = 0; player.glow = 30; sfxTimeStop();
    for (let i=0;i<20;i++) spawnParticle(player.x, player.y, '#8cf');
  }
}

// 摇杆
const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');
let joyActive = false;
let joyVec = { x: 0, y: 0 };
const joyRadius = 55;
function getJoyCenter(){ const r = joystick.getBoundingClientRect(); return { x: r.left + r.width/2, y: r.top + r.height/2 }; }
function updateJoy(clientX, clientY){
  const c = getJoyCenter(); let dx = clientX - c.x, dy = clientY - c.y;
  const dist = Math.hypot(dx, dy);
  if (dist > joyRadius){ dx = dx / dist * joyRadius; dy = dy / dist * joyRadius; }
  stick.style.left = (43 + dx) + 'px'; stick.style.top = (43 + dy) + 'px';
  joyVec.x = dx / joyRadius; joyVec.y = dy / joyRadius;
  if (Math.hypot(joyVec.x, joyVec.y) < 0.15) { joyVec.x = 0; joyVec.y = 0; }
}
function resetJoy(){ joyActive = false; joyVec.x = 0; joyVec.y = 0; stick.style.left = '43px'; stick.style.top = '43px'; joystick.classList.remove('active'); }
joystick.addEventListener('touchstart', e => { e.preventDefault(); ensureAudio(); joyActive = true; joystick.classList.add('active'); updateJoy(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
joystick.addEventListener('touchmove', e => { e.preventDefault(); if (!joyActive) return; updateJoy(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
joystick.addEventListener('touchend', e => { e.preventDefault(); resetJoy(); }, {passive:false});
joystick.addEventListener('touchcancel', () => resetJoy());
joystick.addEventListener('mousedown', e => { e.preventDefault(); joyActive = true; joystick.classList.add('active'); updateJoy(e.clientX, e.clientY); });
window.addEventListener('mousemove', e => { if (joyActive) updateJoy(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (joyActive) resetJoy(); });

function spawnParticle(x, y, color){
  const a = Math.random()*Math.PI*2; const s = 1 + Math.random()*3;
  particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color, size:1+Math.random()*3});
}

function resetGame(){
  player.hp = player.maxHp; player.focus = 0; player.frozen = 0;
  player.hurtFlash = 0; player.glow = 0;
  player.x = boxBattle.x + boxBattle.w/2; player.y = boxBattle.y + boxBattle.h/2;
  state = 'menu'; turnCount = 0; bullets = []; particles = [];
  spawnTimer = 0; battleTimer = 0; shake = 0; fade = 1; hitStop = 0;
  box = { ...boxNormal }; setMessage('按「行动」开始'); resultText = ''; currentMenu = 0;
  talkPoints = 0; mercyReady = false; outcome = ''; enemyShake = 0;
}

function startBattle(){
  state = 'battle'; sfxStart();
  bullets = []; particles = []; spawnTimer = 0; battleTimer = 0;
  turnCount++;
  patternIndex = (turnCount - 1) % 6;
  box = { ...boxBattle };
  player.x = boxBattle.x + boxBattle.w/2; player.y = boxBattle.y + boxBattle.h/2;
  fade = 0.6; enemyShake = 10;
  setMessage(patternName(patternIndex));
}

function patternName(i){
  return ['弹幕来袭：下落','弹幕来袭：横穿','弹幕来袭：追踪','弹幕来袭：心形','弹幕来袭：环形','弹幕来袭：螺旋'][i] || '弹幕来袭！';
}

function endBattle(win){
  if (player.hp <= 0) win = false;
  state = 'result'; fade = 1;
  if (win){ outcome = 'win'; resultText = `你撑过了第 ${turnCount} 回合！`; if (player.focus < player.maxFocus) player.focus = Math.min(player.maxFocus, player.focus + 10); }
  else { outcome = 'lose'; resultText = '你倒下了…'; }
  box = { ...boxNormal };
}

// 弹幕生成
let patternTick = 0;
function spawnBullet(){
  const p = patternIndex;
  patternTick++;
  if (p === 0){
    bullets.push({x: box.x + Math.random()*box.w, y: box.y-10, vx:0, vy:2.2, r:5, type:'circle', trail:[]});
  } else if (p === 1){
    const fromLeft = Math.random() < 0.5;
    bullets.push({x: fromLeft ? box.x-10 : box.x+box.w+10, y: box.y + Math.random()*box.h, vx: fromLeft ? 2.6 : -2.6, vy:0, r:5, type:'circle', trail:[]});
  } else if (p === 2){
    const angle = Math.atan2(player.y - (box.y+box.h/2), player.x - (box.x+box.w/2));
    bullets.push({x: box.x+box.w/2, y: box.y+box.h/2, vx: Math.cos(angle)*1.6, vy: Math.sin(angle)*1.6, r:6, type:'track', trail:[]});
  } else if (p === 3){
    // 心形弹幕：从上方按心形参数落点
    const t = (patternTick % 20) / 20 * Math.PI * 2;
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    bullets.push({x: box.x + box.w/2 + hx*6, y: box.y - 20 + hy*3, vx:0, vy:1.8, r:4, type:'heart', trail:[]});
  } else if (p === 4){
    // 环形弹幕
    if (patternTick % 30 === 0){
      const cx = box.x + box.w/2, cy = box.y + box.h/2;
      for (let i=0;i<12;i++){
        const a = i/12 * Math.PI*2;
        bullets.push({x:cx, y:cy, vx:Math.cos(a)*1.4, vy:Math.sin(a)*1.4, r:4, type:'ring', trail:[]});
      }
    }
  } else {
    // 螺旋弹幕
    const a = patternTick * 0.4;
    bullets.push({x: box.x + box.w/2, y: box.y + box.h/2, vx:Math.cos(a)*1.5, vy:Math.sin(a)*1.5, r:4, type:'spiral', trail:[]});
  }
}

function update(){
  if (fade > 0) fade -= 0.05;
  if (shake > 0) shake *= 0.88;
  if (enemyShake > 0) enemyShake *= 0.85;
  if (player.hurtFlash > 0) player.hurtFlash--;
  if (player.glow > 0) player.glow--;
  if (hitStop > 0) hitStop--;
  enemyBreath += 0.05;

  // 逐字对话
  if (typedMessage.length < message.length){
    typingTimer++;
    if (typingTimer % 2 === 0) typedMessage = message.slice(0, typedMessage.length + 1);
  }

  for (const s of stars){ s.y += s.sp; if (s.y > H){ s.y = 0; s.x = Math.random()*W; } }

  for (let i=particles.length-1; i>=0; i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life -= 0.03;
    if (p.life <= 0) particles.splice(i,1);
  }

  if (state !== 'battle' || hitStop > 0) return;

  if (keys['arrowleft']||keys['a']) player.x -= player.speed;
  if (keys['arrowright']||keys['d']) player.x += player.speed;
  if (keys['arrowup']||keys['w']) player.y -= player.speed;
  if (keys['arrowdown']||keys['s']) player.y += player.speed;
  player.x += joyVec.x * player.speed; player.y += joyVec.y * player.speed;

  player.x = Math.max(box.x+player.size, Math.min(box.x+box.w-player.size, player.x));
  player.y = Math.max(box.y+player.size, Math.min(box.y+box.h-player.size, player.y));

  spawnTimer--;
  const slow = player.frozen > 0 ? 0.35 : 1;
  if (spawnTimer <= 0){ spawnBullet(); spawnTimer = 18 + Math.floor(Math.random()*14); }

  for (let i = bullets.length-1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx * slow; b.y += b.vy * slow;
    b.trail.push({x:b.x, y:b.y});
    if (b.trail.length > 6) b.trail.shift();

    if (b.x < box.x-40 || b.x > box.x+box.w+40 || b.y < box.y-40 || b.y > box.y+box.h+40){
      bullets.splice(i,1); continue;
    }

    const dx = b.x - player.x, dy = b.y - player.y;
    const dist = Math.hypot(dx, dy);

    if (dist < b.r + player.size*0.6){
      player.hp -= 2; player.focus = Math.max(0, player.focus - 15);
      player.hurtFlash = 8; shake = 8; hitStop = 4; sfxHit();
      for (let k=0;k<10;k++) spawnParticle(player.x, player.y, '#ff4a6a');
      bullets.splice(i,1);
      if (player.hp <= 0){ endBattle(false); return; }
    } else if (dist < b.r + player.size*2.2){
      player.focus = Math.min(player.maxFocus, player.focus + 0.25);
      if (Math.random() < 0.3) spawnParticle(player.x, player.y, '#6cf');
    }
  }

  if (player.frozen > 0) player.frozen--;
  battleTimer++;
  if (battleTimer >= BATTLE_FRAMES) endBattle(true);
}

function drawHeart(x,y,size,color,glow){
  ctx.save();
  if (glow){ ctx.shadowColor = color; ctx.shadowBlur = 18; }
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + size*0.3);
  ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size*0.3);
  ctx.bezierCurveTo(x - size, y + size*0.8, x, y + size*1.1, x, y + size*1.4);
  ctx.bezierCurveTo(x, y + size*1.1, x + size, y + size*0.8, x + size, y + size*0.3);
  ctx.bezierCurveTo(x + size, y, x, y, x, y + size*0.3);
  ctx.fill();
  ctx.restore();
}

function drawBar(x, y, w, h, ratio, color, bg){
  ctx.fillStyle = bg; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w*Math.max(0,Math.min(1,ratio)), h);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
  ctx.strokeRect(x+0.5, y+0.5, w-1, h-1);
}

// 像素风敌人立绘
function drawEnemy(cx, cy){
  const breath = Math.sin(enemyBreath) * 3;
  const color = mercyReady ? '#5ad68a' : '#d04a6a';
  const dark = mercyReady ? '#2a8a5a' : '#8a2a4a';
  ctx.save();
  ctx.translate(cx, cy + breath);
  ctx.rotate((Math.random()-0.5) * enemyShake * 0.02);

  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0, 40, 46, 10, 0, 0, Math.PI*2); ctx.fill();

  // 身体
  ctx.shadowColor = mercyReady ? 'rgba(90,214,138,0.6)' : 'rgba(208,74,106,0.6)';
  ctx.shadowBlur = 24;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -40);
  ctx.lineTo(36, -14);
  ctx.lineTo(30, 22);
  ctx.lineTo(0, 38);
  ctx.lineTo(-30, 22);
  ctx.lineTo(-36, -14);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // 暗部
  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.moveTo(0, -40);
  ctx.lineTo(36, -14);
  ctx.lineTo(30, 22);
  ctx.lineTo(0, 38);
  ctx.closePath();
  ctx.fill();

  // 眼睛
  const eyeY = -6;
  ctx.fillStyle = '#000';
  ctx.fillRect(-18, eyeY, 10, 12);
  ctx.fillRect(8, eyeY, 10, 12);
  ctx.fillStyle = mercyReady ? '#bfffd0' : '#ffd0d8';
  ctx.fillRect(-16, eyeY+2, 5, 5);
  ctx.fillRect(10, eyeY+2, 5, 5);

  // 嘴
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (mercyReady){ ctx.arc(0, 12, 8, 0, Math.PI); }
  else { ctx.moveTo(-8, 14); ctx.lineTo(8, 14); }
  ctx.stroke();

  ctx.restore();
}

function draw(){
  // 背景
  const bg = ctx.createRadialGradient(W/2, H*0.35, 40, W/2, H*0.35, 500);
  bg.addColorStop(0, '#12121f');
  bg.addColorStop(1, '#050508');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // 星点
  for (const s of stars){
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#8899cc';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  // 敌人
  drawEnemy(box.x + box.w/2, 110);

  // 对话（逐字）
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px "Courier New",monospace';
  ctx.fillText(typedMessage, 120, 175);

  // 战斗框贴图感：外发光 + 双层描边 + 角标
  ctx.save();
  ctx.shadowColor = 'rgba(120,150,255,0.35)'; ctx.shadowBlur = 18;
  ctx.strokeStyle = '#7a8ac0'; ctx.lineWidth = 4;
  ctx.strokeRect(box.x, box.y, box.w, box.h);
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
  ctx.strokeRect(box.x+5, box.y+5, box.w-10, box.h-10);
  // 角标
  ctx.fillStyle = '#7a8ac0';
  const cs = 8;
  ctx.fillRect(box.x-2, box.y-2, cs, 2); ctx.fillRect(box.x-2, box.y-2, 2, cs);
  ctx.fillRect(box.x+box.w-cs+2, box.y-2, cs, 2); ctx.fillRect(box.x+box.w, box.y-2, 2, cs);
  ctx.fillRect(box.x-2, box.y+box.h, cs, 2); ctx.fillRect(box.x-2, box.y+box.h-cs+2, 2, cs);
  ctx.fillRect(box.x+box.w-cs+2, box.y+box.h, cs, 2); ctx.fillRect(box.x+box.w, box.y+box.h-cs+2, 2, cs);

  if (state === 'menu' || state === 'choose'){
    const labels = ['行动', '仁慈', '—', '—'];
    const cols = 4, cw = box.w / cols, ch = 36;
    const startY = box.y + box.h/2 - ch/2;
    ctx.font = 'bold 13px "Courier New",monospace';
    ctx.textAlign = 'center';
    for (let i = 0; i < cols; i++){
      const cx = box.x + i*cw + cw/2;
      const isActive = (state === 'choose' && i === currentMenu) || (state === 'menu' && i === 0);
      const enabled = i < 2;
      if (isActive){
        ctx.fillStyle = 'rgba(255,210,63,0.15)';
        ctx.fillRect(box.x + i*cw + 2, startY - 4, cw - 4, ch + 8);
        ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2;
        ctx.strokeRect(box.x + i*cw + 2, startY - 4, cw - 4, ch + 8);
      }
      ctx.fillStyle = !enabled ? '#3a3a4a' : (isActive ? '#ffd23f' : '#6a6a8a');
      ctx.fillText(labels[i], cx, startY + ch/2 + 5);
    }
    ctx.textAlign = 'left';
    ctx.fillStyle = '#aab'; ctx.font = '12px "Courier New",monospace';
    ctx.fillText(`交涉 ${talkPoints}/${TALK_NEEDED}` + (mercyReady ? ' · 仁慈可用' : ''), box.x + 20, box.y + box.h + 24);
    if (state === 'choose') ctx.fillText('← → 切换 · Z 确认', box.x + 20, box.y + box.h + 42);
  }

  if (state === 'battle'){
    for (const b of bullets){
      for (let i=0;i<b.trail.length;i++){
        const t = b.trail[i];
        const alpha = (i+1)/b.trail.length * 0.35;
        ctx.beginPath(); ctx.arc(t.x, t.y, b.r*(i+1)/b.trail.length, 0, Math.PI*2);
        ctx.fillStyle = b.type === 'track' ? `rgba(255,210,63,${alpha})` : (b.type==='heart'?`rgba(255,120,160,${alpha})`:`rgba(108,204,255,${alpha})`);
        ctx.fill();
      }
    }
    for (const b of bullets){
      ctx.save();
      ctx.shadowColor = b.type === 'track' ? '#ffd23f' : (b.type==='heart'?'#ff78a0':'#6cf');
      ctx.shadowBlur = 10;
      if (b.type === 'heart'){
        drawHeart(b.x, b.y - b.r, b.r*1.2, '#ff78a0', true);
      } else {
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
        ctx.fillStyle = b.type === 'track' ? '#ffd23f' : '#6cf'; ctx.fill();
      }
      ctx.restore();
    }

    for (const p of particles){
      ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    const heartColor = player.hurtFlash > 0 ? '#fff' : (player.frozen>0 ? '#8cf' : '#ff2b4a');
    drawHeart(player.x, player.y - player.size, player.size, heartColor, true);

    if (player.frozen > 0){
      ctx.strokeStyle = 'rgba(140,200,255,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x, player.y - player.size*0.7, player.size*2.2, 0, Math.PI*2); ctx.stroke();
    }

    ctx.fillStyle = '#fff'; ctx.font = '13px "Courier New",monospace';
    ctx.fillText('HP ' + Math.max(0,player.hp) + '/' + player.maxHp, box.x, box.y+box.h+22);
    drawBar(box.x, box.y+box.h+28, box.w, 10, Math.max(0,player.hp)/player.maxHp, '#e33', '#2a1a1a');
    ctx.fillStyle = '#6cf';
    ctx.fillText('专注 ' + Math.floor(player.focus) + '%', box.x, box.y+box.h+50);
    drawBar(box.x, box.y+box.h+56, box.w, 8, player.focus/player.maxFocus, '#4cf', '#1a1a2a');
  }

  if (state === 'result'){
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px "Courier New",monospace';
    ctx.fillText(resultText, 260, H/2 - 20);
    ctx.fillStyle = '#8a8aa0'; ctx.font = '14px "Courier New",monospace';
    ctx.fillText('点击「重开」再来一次', 260, H/2 + 20);
  }

  ctx.restore();
  if (fade > 0){ ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0,0,W,H); }
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
