<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹幕之心 - 传说之下风格原型</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:monospace;color:#fff;display:flex;justify-content:center;align-items:center;}
  canvas{background:#000;border:2px solid #fff;image-rendering:pixelated;max-width:100vw;max-height:100vh;}
</style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// 战斗框
const box = { x: 170, y: 260, w: 300, h: 180 };

// 玩家红心
const player = {
  x: box.x + box.w/2, y: box.y + box.h/2,
  size: 10, speed: 3.2,
  hp: 20, maxHp: 20,
  focus: 0, maxFocus: 100, frozen: 0,
  turnTimer: 0
};

// 状态机
let state = 'menu'; // menu | enemyTurn | win | lose
let turnCount = 0;
let bullets = [];
let spawnTimer = 0;
let patternIndex = 0;
let message = '按 [Z] 行动 / [X] 仁慈';

const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (state === 'menu') {
    if (k === 'z') startEnemyTurn(false);
    if (k === 'x') startEnemyTurn(true);
  }
  if (state === 'enemyTurn' && k === 'c' && player.focus >= player.maxFocus) {
    player.frozen = 90;
    player.focus = 0;
  }
  if (k === 'r') resetGame();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function startEnemyTurn(mercy){
  state = 'enemyTurn';
  bullets = [];
  spawnTimer = 0;
  player.turnTimer = 0;
  turnCount++;
  patternIndex = turnCount % 3;
  message = mercy ? '你选择了仁慈…但弹幕不会停。' : '敌人回合：躲避弹幕！';
}

function endEnemyTurn(){
  if (player.hp <= 0){ state = 'lose'; message = '你倒下了…按 R 重来'; return; }
  state = 'menu';
  message = `第 ${turnCount} 回合结束。按 [Z] 继续 / [X] 仁慈`;
  if (player.focus < player.maxFocus) player.focus = Math.min(player.maxFocus, player.focus + 10);
}

function resetGame(){
  player.hp = player.maxHp;
  player.focus = 0;
  player.frozen = 0;
  player.x = box.x + box.w/2;
  player.y = box.y + box.h/2;
  state = 'menu';
  turnCount = 0;
  bullets = [];
  player.turnTimer = 0;
  message = '按 [Z] 行动 / [X] 仁慈';
}

function spawnBullet(){
  const p = patternIndex;
  if (p === 0){
    bullets.push({x: box.x + Math.random()*box.w, y: box.y-10, vx:0, vy:2.2, r:5, type:'circle'});
  } else if (p === 1){
    const fromLeft = Math.random() < 0.5;
    bullets.push({
      x: fromLeft ? box.x-10 : box.x+box.w+10,
      y: box.y + Math.random()*box.h,
      vx: fromLeft ? 2.6 : -2.6, vy:0, r:5, type:'circle'
    });
  } else {
    const angle = Math.atan2(player.y - (box.y+box.h/2), player.x - (box.x+box.w/2));
    bullets.push({
      x: box.x+box.w/2, y: box.y+box.h/2,
      vx: Math.cos(angle)*1.6, vy: Math.sin(angle)*1.6, r:6, type:'track'
    });
  }
}

function update(){
  if (state !== 'enemyTurn') return;

  if (keys['arrowleft']||keys['a']) player.x -= player.speed;
  if (keys['arrowright']||keys['d']) player.x += player.speed;
  if (keys['arrowup']||keys['w']) player.y -= player.speed;
  if (keys['arrowdown']||keys['s']) player.y += player.speed;

  player.x = Math.max(box.x+player.size, Math.min(box.x+box.w-player.size, player.x));
  player.y = Math.max(box.y+player.size, Math.min(box.y+box.h-player.size, player.y));

  spawnTimer--;
  const slow = player.frozen > 0 ? 0.35 : 1;
  if (spawnTimer <= 0){
    spawnBullet();
    spawnTimer = 18 + Math.random()*14;
  }

  for (let i = bullets.length-1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx * slow;
    b.y += b.vy * slow;

    if (b.x < box.x-30 || b.x > box.x+box.w+30 || b.y < box.y-30 || b.y > box.y+box.h+30){
      bullets.splice(i,1); continue;
    }

    const dx = b.x - player.x, dy = b.y - player.y;
    const dist = Math.hypot(dx, dy);

    if (dist < b.r + player.size*0.6){
      player.hp -= 2;
      player.focus = Math.max(0, player.focus - 15);
      bullets.splice(i,1);
      if (player.hp <= 0){ endEnemyTurn(); return; }
    } else if (dist < b.r + player.size*2.2){
      player.focus = Math.min(player.maxFocus, player.focus + 0.25);
    }
  }

  if (player.frozen > 0) player.frozen--;

  player.turnTimer++;
  if (player.turnTimer > 480){
    endEnemyTurn();
  }
}

function drawHeart(x,y,size,color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + size*0.3);
  ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size*0.3);
  ctx.bezierCurveTo(x - size, y + size*0.8, x, y + size*1.1, x, y + size*1.4);
  ctx.bezierCurveTo(x, y + size*1.1, x + size, y + size*0.8, x + size, y + size*0.3);
  ctx.bezierCurveTo(x + size, y, x, y, x, y + size*0.3);
  ctx.fill();
}

function draw(){
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeRect(box.x, box.y, box.w, box.h);

  if (state === 'menu'){
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.fillText('* 敌人拦住了你。', box.x, box.y - 60);
    ctx.fillText(message, box.x, box.y - 30);
    ctx.fillText('专注: ' + Math.floor(player.focus) + '%  (C 时停)', box.x, box.y + box.h + 30);
  }

  if (state === 'enemyTurn'){
    for (const b of bullets){
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fillStyle = b.type === 'track' ? '#ffd23f' : '#6cf';
      ctx.fill();
    }

    drawHeart(player.x, player.y - player.size, player.size, player.frozen>0 ? '#8cf' : '#ff2b4a');

    ctx.fillStyle = '#333'; ctx.fillRect(box.x, box.y+box.h+10, box.w, 10);
    ctx.fillStyle = '#e33'; ctx.fillRect(box.x, box.y+box.h+10, box.w*(player.hp/player.maxHp), 10);
    ctx.fillStyle = '#333'; ctx.fillRect(box.x, box.y+box.h+26, box.w, 8);
    ctx.fillStyle = '#4cf'; ctx.fillRect(box.x, box.y+box.h+26, box.w*(player.focus/player.maxFocus), 8);

    ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
    ctx.fillText('HP ' + player.hp + '/' + player.maxHp, box.x, box.y-20);
    ctx.fillText('专注 ' + Math.floor(player.focus) + '%  [C]时停', box.x, box.y-4);
  }

  if (state === 'win' || state === 'lose'){
    ctx.fillStyle = '#fff'; ctx.font = '20px monospace';
    ctx.fillText(message, 120, H/2);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
  </html>
