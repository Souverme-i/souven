<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>躲避弹幕移动端</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:monospace;color:#fff;touch-action:none;user-select:none;}

  #rotate{position:fixed;inset:0;background:#000;z-index:999;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    font-size:18px;color:#aaa;text-align:center;line-height:2;}
  #rotate .icon{font-size:48px;margin-bottom:16px;animation:spin 2s linear infinite;}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(90deg)}}
  @media (orientation: landscape){ #rotate{display:none;} }

  #game-wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;}
  canvas{background:#000;border:2px solid #fff;image-rendering:pixelated;
    max-width:100vw;max-height:100vh;}

  #controls{position:fixed;inset:0;pointer-events:none;z-index:10;
    display:flex;justify-content:space-between;align-items:flex-end;
    padding:0 24px 24px;}

  #joystick{width:150px;height:150px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.05);
    position:relative;pointer-events:auto;touch-action:none;flex-shrink:0;}
  #stick{width:64px;height:64px;border-radius:50%;
    background:rgba(255,255,255,0.35);position:absolute;
    left:43px;top:43px;transition:background 0.1s;}
  #joystick.active #stick{background:rgba(255,255,255,0.65);}

  #buttons{display:flex;flex-direction:column;gap:14px;pointer-events:auto;flex-shrink:0;}
  .btn{width:76px;height:76px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.08);
    color:#fff;font-size:16px;font-family:monospace;
    display:flex;justify-content:center;align-items:center;
    touch-action:none;cursor:pointer;}
  .btn:active{background:rgba(255,255,255,0.3);}
  .btn.small{width:58px;height:58px;font-size:12px;}
  .btn-row{display:flex;gap:14px;justify-content:flex-end;}

  @media (orientation: portrait){
    #controls, #game-wrap{display:none;}
  }
</style>
</head>
<body>

<div id="rotate">
  <div class="icon">📱</div>
  请将手机横屏<br>以获得最佳游戏体验
</div>

<div id="game-wrap">
  <canvas id="game" width="800" height="450"></canvas>
</div>

<div id="controls">
  <div id="joystick"><div id="stick"></div></div>
  <div id="buttons">
    <div class="btn-row">
      <div class="btn small" id="btnC">时停</div>
      <div class="btn small" id="btnR">重开</div>
    </div>
    <div class="btn-row">
      <div class="btn" id="btnX">仁慈</div>
      <div class="btn" id="btnZ">行动</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const box = { x: 250, y: 200, w: 300, h: 180 };

const player = {
  x: box.x + box.w/2, y: box.y + box.h/2,
  size: 10, speed: 3.4,
  hp: 20, maxHp: 20,
  focus: 0, maxFocus: 100,
  frozen: 0
};

let state = 'menu';
let turnCount = 0;
let bullets = [];
let spawnTimer = 0;
let patternIndex = 0;
let battleTimer = 0;
const BATTLE_FRAMES = 420;
let message = '按 行动 开始战斗';
let resultText = '';

const keys = {};

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (e.key.startsWith('Arrow')) e.preventDefault();
  handleAction(k);
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function handleAction(k){
  if (state === 'menu' && (k === 'z' || k === 'x')) startBattle(k === 'x');
  else if (state === 'battle' && k === 'c') tryTimeStop();
  else if (state === 'result' && k === 'r') resetGame();
}

function bindBtn(id, action){
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); action(); }, {passive:false});
  el.addEventListener('mousedown', e => { e.preventDefault(); action(); });
}
bindBtn('btnZ', () => { if (state==='menu') startBattle(false); });
bindBtn('btnX', () => { if (state==='menu') startBattle(true); });
bindBtn('btnC', () => tryTimeStop());
bindBtn('btnR', () => resetGame());

function tryTimeStop(){
  if (state === 'battle' && player.focus >= player.maxFocus){
    player.frozen = 90;
    player.focus = 0;
  }
}

const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');
let joyActive = false;
let joyVec = { x: 0, y: 0 };
const joyRadius = 55;

function getJoyCenter(){
  const r = joystick.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

function updateJoy(clientX, clientY){
  const c = getJoyCenter();
  let dx = clientX - c.x, dy = clientY - c.y;
  const dist = Math.hypot(dx, dy);
  if (dist > joyRadius){
    dx = dx / dist * joyRadius;
    dy = dy / dist * joyRadius;
  }
  stick.style.left = (43 + dx) + 'px';
  stick.style.top = (43 + dy) + 'px';
  joyVec.x = dx / joyRadius;
  joyVec.y = dy / joyRadius;
  if (Math.hypot(joyVec.x, joyVec.y) < 0.15) { joyVec.x = 0; joyVec.y = 0; }
}

function resetJoy(){
  joyActive = false;
  joyVec.x = 0; joyVec.y = 0;
  stick.style.left = '43px';
  stick.style.top = '43px';
  joystick.classList.remove('active');
}

joystick.addEventListener('touchstart', e => {
  e.preventDefault();
  joyActive = true;
  joystick.classList.add('active');
  const t = e.touches[0];
  updateJoy(t.clientX, t.clientY);
}, {passive:false});

joystick.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!joyActive) return;
  const t = e.touches[0];
  updateJoy(t.clientX, t.clientY);
}, {passive:false});

joystick.addEventListener('touchend', e => { e.preventDefault(); resetJoy(); }, {passive:false});
joystick.addEventListener('touchcancel', () => resetJoy());

joystick.addEventListener('mousedown', e => {
  e.preventDefault();
  joyActive = true;
  joystick.classList.add('active');
  updateJoy(e.clientX, e.clientY);
});
window.addEventListener('mousemove', e => {
  if (joyActive) updateJoy(e.clientX, e.clientY);
});
window.addEventListener('mouseup', () => { if (joyActive) resetJoy(); });

function resetGame(){
  player.hp = player.maxHp;
  player.focus = 0;
  player.frozen = 0;
  player.x = box.x + box.w/2;
  player.y = box.y + box.h/2;
  state = 'menu';
  turnCount = 0;
  bullets = [];
  spawnTimer = 0;
  battleTimer = 0;
  message = '按 行动 开始战斗';
  resultText = '';
}

function startBattle(mercy){
  state = 'battle';
  bullets = [];
  spawnTimer = 0;
  battleTimer = 0;
  turnCount++;
  patternIndex = (turnCount - 1) % 3;
  message = mercy ? '你选择了仁慈…但弹幕不会停。' : '敌人回合：躲避弹幕！';
}

function endBattle(win){
  if (player.hp <= 0) win = false;
  state = 'result';
  if (win){
    resultText = `你撑过了第 ${turnCount} 回合！`;
    if (player.focus < player.maxFocus) player.focus = Math.min(player.maxFocus, player.focus + 10);
  } else {
    resultText = '你倒下了…';
  }
}

function spawnBullet(){
  const p = patternIndex;
  if (p === 0){
    bullets.push({x: box.x + Math.random()*box.w, y: box.y-10, vx:0, vy:2.2, r:5, type:'circle'});
  } else if (p === 1){
    const fromLeft = Math.random() < 0.5;
    bullets.push({
      x: fromLeft ? box.x-10 : box.x+box.w+10,
      y: box.y + Math.random()*box.h,
      vx: fromLeft ? 2.6 : -2.6, vy:0, r:5, type:'circle'
    });
  } else {
    const angle = Math.atan2(player.y - (box.y+box.h/2), player.x - (box.x+box.w/2));
    bullets.push({
      x: box.x+box.w/2, y: box.y+box.h/2,
      vx: Math.cos(angle)*1.6, vy: Math.sin(angle)*1.6, r:6, type:'track'
    });
  }
}

function update(){
  if (state !== 'battle') return;

  if (keys['arrowleft']||keys['a']) player.x -= player.speed;
  if (keys['arrowright']||keys['d']) player.x += player.speed;
  if (keys['arrowup']||keys['w']) player.y -= player.speed;
  if (keys['arrowdown']||keys['s']) player.y += player.speed;

  player.x += joyVec.x * player.speed;
  player.y += joyVec.y * player.speed;

  player.x = Math.max(box.x+player.size, Math.min(box.x+box.w-player.size, player.x));
  player.y = Math.max(box.y+player.size, Math.min(box.y+box.h-player.size, player.y));

  spawnTimer--;
  const slow = player.frozen > 0 ? 0.35 : 1;
  if (spawnTimer <= 0){
    spawnBullet();
    spawnTimer = 18 + Math.floor(Math.random()*14);
  }

  for (let i = bullets.length-1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx * slow;
    b.y += b.vy * slow;

    if (b.x < box.x-30 || b.x > box.x+box.w+30 || b.y < box.y-30 || b.y > box.y+box.h+30){
      bullets.splice(i,1); continue;
    }

    const dx = b.x - player.x, dy = b.y - player.y;
    const dist = Math.hypot(dx, dy);

    if (dist < b.r + player.size*0.6){
      player.hp -= 2;
      player.focus = Math.max(0, player.focus - 15);
      bullets.splice(i,1);
      if (player.hp <= 0){ endBattle(false); return; }
    } else if (dist < b.r + player.size*2.2){
      player.focus = Math.min(player.maxFocus, player.focus + 0.25);
    }
  }

  if (player.frozen > 0) player.frozen--;

  battleTimer++;
  if (battleTimer >= BATTLE_FRAMES) endBattle(true);
}

function drawHeart(x,y,size,color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + size*0.3);
  ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size*0.3);
  ctx.bezierCurveTo(x - size, y + size*0.8, x, y + size*1.1, x, y + size*1.4);
  ctx.bezierCurveTo(x, y + size*1.1, x + size, y + size*0.8, x + size, y + size*0.3);
  ctx.bezierCurveTo(x + size, y, x, y, x, y + size*0.3);
  ctx.fill();
}

function draw(){
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeRect(box.x, box.y, box.w, box.h);

  if (state === 'menu'){
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.fillText('* 敌人拦住了你。', box.x, box.y - 60);
    ctx.fillText(message, box.x, box.y - 30);
    ctx.fillText('专注: ' + Math.floor(player.focus) + '%', box.x, box.y + box.h + 30);
  }

  if (state === 'battle'){
    for (const b of bullets){
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fillStyle = b.type === 'track' ? '#ffd23f' : '#6cf';
      ctx.fill();
    }

    drawHeart(player.x, player.y - player.size, player.size, player.frozen>0 ? '#8cf' : '#ff2b4a');

    ctx.fillStyle = '#333'; ctx.fillRect(box.x, box.y+box.h+10, box.w, 10);
    ctx.fillStyle = '#e33'; ctx.fillRect(box.x, box.y+box.h+10, box.w*(Math.max(0,player.hp)/player.maxHp), 10);
    ctx.fillStyle = '#333'; ctx.fillRect(box.x, box.y+box.h+26, box.w, 8);
    ctx.fillStyle = '#4cf'; ctx.fillRect(box.x, box.y+box.h+26, box.w*(player.focus/player.maxFocus), 8);

    ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
    ctx.fillText('HP ' + Math.max(0,player.hp) + '/' + player.maxHp, box.x, box.y-20);
    ctx.fillText('专注 ' + Math.floor(player.focus) + '%', box.x, box.y-4);
    ctx.fillText(message, box.x, box.y-40);
  }

  if (state === 'result'){
    ctx.fillStyle = '#fff'; ctx.font = '20px monospace';
    ctx.fillText(resultText, 280, H/2 - 20);
    ctx.font = '14px monospace';
    ctx.fillText('点击「重开」再来一次', 280, H/2 + 20);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
